# Overview charts of each data environment.
# chart: mark (line | area | bar | barh | dot | hist), x, y, color, size, height, xLabel, yLabel.
nyc_bikeshare:
  - id: daily_trips
    title: Trips per day
    sql: |
      SELECT CAST(starttime AS DATE) AS day, count(*) AS trips
      FROM trips GROUP BY 1 ORDER BY 1
    chart: {mark: line, x: day, y: trips, xLabel: null, window: 7}
    caption: Light line, trips per day. Dark line, centered 7-day mean.
  - id: monthly_usertype
    title: Trips per month by user type
    unit: Subscriber = member, Customer = pass holder
    sql: |
      SELECT date_trunc('month', starttime)::DATE AS month, coalesce(usertype, 'unknown') AS user_type,
        count(*) AS trips
      FROM trips GROUP BY ALL ORDER BY 1, 2
    chart: {mark: area, x: month, y: trips, color: user_type, xLabel: null}
  - id: hourly
    title: Trips by hour of the day, 2017
    unit: average trips per day
    sql: |
      SELECT hour(starttime) AS hour,
        CASE WHEN dayofweek(starttime) IN (0, 6) THEN 'weekend' ELSE 'weekday' END AS day_type,
        count(*) / count(DISTINCT CAST(starttime AS DATE)) AS trips_per_day
      FROM trips WHERE year(starttime) = 2017 GROUP BY ALL ORDER BY 2, 1
    chart: {mark: line, x: hour, y: trips_per_day, color: day_type, yLabel: trips per day}
  - id: temperature
    title: Daily trips and maximum temperature, 2017
    unit: Central Park, GHCN-Daily TMAX
    sql: |
      WITH d AS (SELECT CAST(starttime AS DATE) AS day, count(*) AS trips
                 FROM trips WHERE year(starttime) = 2017 GROUP BY 1)
      SELECT d.day, d.trips, g.value / 10.0 AS tmax_c,
        CASE WHEN dayofweek(d.day) IN (0, 6) THEN 'weekend' ELSE 'weekday' END AS day_type
      FROM d JOIN ghcnd g ON g.date = d.day AND g.element = 'TMAX' AND g.id = 'USW00094728'
      ORDER BY 1
    chart: {mark: dot, x: tmax_c, y: trips, color: day_type, xLabel: maximum temperature (°C)}
  - id: duration
    title: Ride time, 2017
    unit: rides under one hour, by minute
    sql: |
      SELECT floor(tripduration / 60)::INT AS minutes, usertype AS user_type, count(*) AS trips
      FROM trips WHERE year(starttime) = 2017 AND tripduration < 3600 AND usertype IS NOT NULL
      GROUP BY ALL ORDER BY 2, 1
    chart: {mark: line, x: minutes, y: trips, color: user_type, xLabel: ride time (minutes)}
  - id: taxi
    title: Taxi pickups per month
    unit: NYC TLC yellow and green taxis
    sql: |
      SELECT date_trunc('month', date)::DATE AS month, service, sum(trips) AS pickups
      FROM taxi_daily GROUP BY ALL ORDER BY 1, 2
    chart: {mark: line, x: month, y: pickups, color: service, xLabel: null}
  - id: station_map
    type: map
    title: Stations and their departures in 2017
    layers: [taxi_zones]
    sql: |
      SELECT s.station_id, s.name, s.latitude AS lat, s.longitude AS lon, s.borough,
        year(s.first_trip)::VARCHAR AS opened, count(*) AS trips_2017
      FROM stations s
      JOIN trips t ON t.start_station_id = s.station_id AND year(t.starttime) = 2017
      WHERE s.latitude IS NOT NULL AND s.latitude > 40
      GROUP BY ALL
    chart: {lon: lon, lat: lat, r: trips_2017, color: borough, color_options: [borough, opened], title: name, height: 640}
    caption: Dot size is the number of departures in 2017. Outlines are the TLC taxi zones.
br_ecommerce:
  - id: daily_orders
    title: Orders per day
    sql: |
      SELECT CAST(order_purchase_timestamp AS DATE) AS day, count(*) AS orders
      FROM orders GROUP BY 1 ORDER BY 1
    chart: {mark: line, x: day, y: orders, xLabel: null, window: 7}
    caption: Light line, orders per day. Dark line, centered 7-day mean. The peak is Black Friday, November 24, 2017.
  - id: monthly_status
    title: Orders per month by status
    sql: |
      SELECT date_trunc('month', order_purchase_timestamp)::DATE AS month,
        CASE WHEN order_status IN ('delivered', 'shipped', 'canceled', 'unavailable') THEN order_status ELSE 'other' END AS status,
        count(*) AS orders
      FROM orders GROUP BY ALL ORDER BY 1, 2
    chart: {mark: area, x: month, y: orders, color: status, xLabel: null}
  - id: weekday_hour
    title: Orders by hour of the day
    unit: January 2017 to August 2018
    sql: |
      SELECT hour(order_purchase_timestamp) AS hour,
        CASE WHEN dayofweek(order_purchase_timestamp) IN (0, 6) THEN 'weekend' ELSE 'weekday' END AS day_type,
        count(*) / count(DISTINCT CAST(order_purchase_timestamp AS DATE)) AS orders_per_day
      FROM orders WHERE order_purchase_timestamp >= '2017-01-01' AND order_purchase_timestamp < '2018-09-01'
      GROUP BY ALL ORDER BY 2, 1
    chart: {mark: line, x: hour, y: orders_per_day, color: day_type, yLabel: orders in the hour (average day)}
  - id: delivery_days
    title: Delivery time
    unit: delivered orders, days from purchase to delivery (up to 60)
    sql: |
      SELECT floor(epoch(order_delivered_customer_date - order_purchase_timestamp) / 86400)::INT AS days, count(*) AS orders
      FROM orders WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
        AND order_delivered_customer_date - order_purchase_timestamp < INTERVAL 60 DAY
      GROUP BY 1 ORDER BY 1
    chart: {mark: bar, x: days, y: orders, xLabel: whole days from purchase to delivery, yLabel: orders}
  - id: promise
    title: Promised and actual delivery time by purchase month
    unit: delivered orders, mean days
    sql: |
      SELECT date_trunc('month', order_purchase_timestamp)::DATE AS month, 'promised' AS measure,
        avg(date_diff('day', CAST(order_purchase_timestamp AS DATE), CAST(order_estimated_delivery_date AS DATE))) AS days
      FROM orders WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
        AND order_purchase_timestamp >= '2017-01-01' AND order_purchase_timestamp < '2018-09-01' GROUP BY 1
      UNION ALL
      SELECT date_trunc('month', order_purchase_timestamp)::DATE, 'actual',
        avg(date_diff('day', CAST(order_purchase_timestamp AS DATE), CAST(order_delivered_customer_date AS DATE)))
      FROM orders WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
        AND order_purchase_timestamp >= '2017-01-01' AND order_purchase_timestamp < '2018-09-01' GROUP BY 1
      ORDER BY 1, 2
    chart: {mark: line, x: month, y: days, color: measure, xLabel: null}
  - id: review_by_delay
    title: Review score by delivery against the promise
    unit: delivered orders
    sql: |
      SELECT CASE WHEN dd <= -10 THEN '10+ days early' WHEN dd <= 0 THEN '0-9 days early'
          WHEN dd <= 3 THEN '1-3 days late' WHEN dd <= 7 THEN '4-7 days late' ELSE '8+ days late' END AS delivery,
        min(dd) AS k, avg(review_score) AS avg_score
      FROM (SELECT date_diff('day', CAST(o.order_estimated_delivery_date AS DATE), CAST(o.order_delivered_customer_date AS DATE)) AS dd,
              r.review_score FROM orders o JOIN order_reviews r USING (order_id)
            WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date IS NOT NULL)
      GROUP BY 1 ORDER BY k
    chart: {mark: bar, x: delivery, y: avg_score, yLabel: average review score}
  - id: categories
    title: Items sold by product category
    unit: top 20 categories, English names
    sql: |
      SELECT coalesce(t.product_category_name_english, p.product_category_name, '(no category)') AS category, count(*) AS items
      FROM order_items i JOIN products p USING (product_id)
      LEFT JOIN product_category_name_translation t USING (product_category_name)
      GROUP BY 1 ORDER BY 2 DESC LIMIT 20
    chart: {mark: barh, x: category, y: items, yLabel: items}
  - id: payments
    title: Payments per month by type
    sql: |
      SELECT date_trunc('month', o.order_purchase_timestamp)::DATE AS month, p.payment_type, count(*) AS payments
      FROM order_payments p JOIN orders o USING (order_id) WHERE p.payment_type <> 'not_defined'
      GROUP BY ALL ORDER BY 1, 2
    chart: {mark: area, x: month, y: payments, color: payment_type, xLabel: null}
  - id: state_demand
    title: Orders per 100,000 inhabitants by state, 2017
    unit: population of July 1, 2018 (IBGE)
    sql: |
      SELECT s.name AS state, count(*) * 1e5 / any_value(s.population_2018) AS orders_per_100k
      FROM orders o JOIN customers c USING (customer_id) JOIN states s ON s.uf = c.customer_state
      WHERE year(o.order_purchase_timestamp) = 2017 GROUP BY 1 ORDER BY 2 DESC
    chart: {mark: barh, x: state, y: orders_per_100k, yLabel: orders per 100,000 inhabitants}
  - id: leads
    title: Marketing qualified leads by channel
    unit: with the share that became sellers
    sql: |
      SELECT coalesce(q.origin, '(missing)') AS origin, count(*) AS leads, count(c.mql_id) AS closed
      FROM leads_qualified q LEFT JOIN leads_closed c USING (mql_id) GROUP BY 1 ORDER BY 2 DESC
    chart: {mark: barh, x: origin, y: leads, yLabel: leads}
  - id: usd_brl
    title: US dollar exchange rate
    unit: R$ per US$, Banco Central do Brasil
    sql: SELECT date, usd_brl FROM exchange_rates ORDER BY 1
    chart: {mark: line, x: date, y: usd_brl, xLabel: null, yLabel: R$ per US$, zero: false}
  - id: customer_map
    type: map
    title: Customers by ZIP code prefix
    layers: [states]
    sql: |
      SELECT z.zip_code_prefix, z.city || ' (' || z.state || ')' AS place, z.lat, z.lon, s.region, count(*) AS customers
      FROM customers c JOIN zip_prefixes z ON z.zip_code_prefix = c.customer_zip_code_prefix
      JOIN states s ON s.uf = z.state
      WHERE z.in_state GROUP BY ALL
    chart: {lon: lon, lat: lat, r: customers, color: region, color_options: [region], title: place, height: 640}
    caption: Dot size is the number of customers. Points come from the median position of each ZIP code prefix; prefixes whose position falls outside their state are left out. Outlines are the IBGE states.
